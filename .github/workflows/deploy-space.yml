name: Deploy demo to Hugging Face

# Publishes the static replay demo (a copy of demo/public plus a banner) to a
# Hugging Face static Space whenever it changes on main. No backend, no model.
# Setup (once): add the repository secret HF_TOKEN (a write token) and the
# repository variable HF_SPACE_ID (e.g. "<hf-user>/pipeline-medic").
# Without them the job is skipped.
on:
  push:
    branches: [main]
    paths:
      - "demo/public/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  sync:
    if: vars.HF_SPACE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Stage the Space
        run: python deploy/huggingface/build_space.py space
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install huggingface_hub==1.33.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          # public static Space on free CPU; no-op if it already exists
          api.create_repo(os.environ["HF_SPACE_ID"], repo_type="space", space_sdk="static",
                          private=False, exist_ok=True)
          api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"], repo_type="space", folder_path="space",
              commit_message=f"Sync from GitHub {os.environ['GITHUB_SHA'][:7]}",
              # remove files left over from earlier uploads; keep .gitattributes
              delete_patterns=["*.html", "*.json", "app/**", "agents/**", "mcp_server/**",
                               "rag/**", "demo/**", "data/**", "Dockerfile", ".dockerignore"],
          )
          PY
