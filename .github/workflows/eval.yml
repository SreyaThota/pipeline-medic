name: Retrieval eval

# Runs the v0.2.5 comparison (flat vs graph vs hybrid) on demand. It needs
# the embedding model and Neo4j, which is more memory than a laptop running
# other apps can always spare.
on:
  workflow_dispatch:

jobs:
  graph-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_server_memory_heap_max__size: 1g
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO /dev/null http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Flat RAG baseline (v0.2)
        run: python -m evaluation.run_eval
      - name: GraphRAG comparison (v0.2.5)
        run: python -m evaluation.run_graph_eval
      - uses: actions/upload-artifact@v5
        with:
          name: eval-results
          path: evaluation/results/
