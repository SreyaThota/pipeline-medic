[project]
name = "pipeline-medic"
version = "0.2.6"
description = "Agentic CI/CD reliability copilot"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Sreya Thota" }]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "requests==2.34.2",
    "chromadb==1.5.9",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "neo4j==6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "types-requests==2.33.0.20261006",
]

[tool.ruff]
line-length = 100
extend-exclude = ["data/sample_logs"]

[tool.mypy]
# Strict for the PipelineMedic X application package; the older research
# code (rag/, evaluation/, data/) is checked from Phase 3 when it moves in.
python_version = "3.14"
files = ["app"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["neo4j.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
